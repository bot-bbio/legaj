<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to LeGaJ (spike)</title>
    <link rel="stylesheet" href="/static/spike.css" />
  </head>
  <body>
    <main>
      <h1>Save to LeGaJ <small>spike</small></h1>
      <p id="status" class="status">Waiting for the job page…</p>
      <dl id="summary" hidden>
        <dt>Site</dt><dd id="s-host"></dd>
        <dt>Heading</dt><dd id="s-h1"></dd>
        <dt>Channel</dt><dd id="s-channel"></dd>
        <dt>JSON-LD blocks</dt><dd id="s-ld"></dd>
        <dt>JobPosting found</dt><dd id="s-jp"></dd>
        <dt>Page text</dt><dd id="s-text"></dd>
        <dt>Payload size</dt><dd id="s-size"></dd>
      </dl>
      <button id="save" type="button" disabled>Save capture</button>
      <p id="saved" class="note"></p>
      <p class="note">
        Save stores the full page snapshot in <code>spike/bookmarklet/out/captures/</code> as a candidate test
        fixture. The handoff result is logged either way.
      </p>
    </main>
    <script src="/static/clip.js"></script>
  </body>
</html>
